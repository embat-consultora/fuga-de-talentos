name: Supabase Schema Backup

on:
  schedule:
    - cron: "0 0 * * *"  # Every day at midnight UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push to the repo

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}

    steps:
      - name: Check if backups are enabled
        run: |
          if [ "$BACKUP_ENABLED" != "true" ]; then
            echo "🛑 Backups are disabled. Set BACKUP_ENABLED=true to enable backups."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest  # or pin a specific version for stability

      - name: Create backup directory
        run: mkdir -p dumps

      - name: Dump Supabase schema to SQL file
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d')
          supabase db dump --db-url "$SUPABASE_DB_URL" > "dumps/backup_$TIMESTAMP.sql"

      - name: Commit and push backup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dumps/
          git commit -m "📦 Supabase schema backup on $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
